<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="NEST is an apartment community management portal for residents and administrators.">

    <meta name="theme-color" content="#17263B">

    <title>NEST | Apartment Community Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN SCREEN -->
    <section id="loginScreen" class="login-screen">

        <div class="login-card">

            <div class="brand">
                <span class="brand-icon">N</span>
                <h2>NEST</h2>
            </div>

            <div class="login-header">
                <h1>Welcome home.</h1>
                <p>
                    Access your apartment community portal
                    and stay connected with your community.
                </p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Your name</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your name"
                        minlength="2"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="userRole">Select your role</label>
                    <select id="userRole" required>
                        <option value="resident">Resident</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <button type="submit" class="primary-btn">
                    Enter Portal →
                </button>

            </form>

            <p class="login-footer">
                NEST · Apartment Community Management
            </p>

        </div>
    </section>


    <!-- MAIN APPLICATION -->
    <div id="app" class="app hidden">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="brand">
                <span class="brand-icon">N</span>
                <h2>NEST</h2>
            </div>

            <p class="menu-label">MENU</p>

            <nav id="navigation"></nav>

            <div class="sidebar-footer">

                <button
                    type="button"
                    id="logoutBtn"
                    class="logout-btn"
                >
                    ↪ Logout
                </button>

                <p class="sidebar-version">
                    NEST Portal · Version 2.0
                </p>

            </div>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- HEADER -->
            <header class="topbar">

                <div class="page-heading">
                    <h2 id="pageTitle">Dashboard</h2>
                    <p>Apartment Community Management</p>
                </div>

                <div class="user-info">

                    <div class="avatar" id="avatar">U</div>

                    <div>
                        <span id="displayName">User</span>
                        <small id="displayRole"></small>
                    </div>

                </div>

            </header>


            <!-- DYNAMIC CONTENT -->
            <section
                id="content"
                class="content"
                aria-live="polite"
            ></section>

        </main>

    </div>


    <script src="app.js"></script>

</body>
</html>
